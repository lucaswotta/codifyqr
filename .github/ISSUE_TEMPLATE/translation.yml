name: Translation
description: Add a language or fix a string.
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language and region (for example fr, de, pt-PT)
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Strings to fix, or whether you will open a pull request
      description: See the translation section in CONTRIBUTING.md.
