name: Bug
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: symptom
    attributes:
      label: Symptom
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Do not paste Pix keys, passwords or other private content. Use fake values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and obtained
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, version and operating system
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Console output, a screenshot, or the exported file.
