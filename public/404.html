<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 | CodifyQR</title>
    <link rel="icon" href="__BASE__favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #f5f4ef; --ink: #000; --accent: #c8231a; --line: #000; }
      @media (prefers-color-scheme: dark) { :root { --bg: #000; --ink: #f5f4ef; --accent: #ff5a4d; --line: #e6e4dc; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 400 16px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
      main { width: min(92vw, 30rem); border: 1px solid var(--line); padding: 32px; display: grid; gap: 16px; justify-items: start; }
      img { width: 96px; height: 96px; }
      h1 { margin: 0; font-size: 2.2rem; line-height: 1.05; letter-spacing: -0.03em; }
      h1 span { color: var(--accent); }
      h1 b { font-weight: inherit; }
      p { margin: 0; }
      a { display: inline-block; padding: 10px 18px; border: 1px solid var(--accent); background: var(--accent); color: var(--bg); font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="__BASE__icons/icon-192.png" alt="" />
      <h1><span>404</span> <b id="t-title">Page not found.</b></h1>
      <p id="t-text">This address does not exist in CodifyQR.</p>
      <a id="t-link" href="__BASE__">Back to the app</a>
    </main>
    <script>
      var lang = (navigator.language || 'en').toLowerCase();
      var texts = {
        pt: ['Página não encontrada.', 'Este endereço não existe no CodifyQR.', 'Voltar ao app'],
        es: ['Página no encontrada.', 'Esta dirección no existe en CodifyQR.', 'Volver a la app'],
      };
      var pick = texts[lang.slice(0, 2)];
      if (pick) {
        document.documentElement.lang = lang.slice(0, 2);
        document.getElementById('t-title').textContent = pick[0];
        document.getElementById('t-text').textContent = pick[1];
        document.getElementById('t-link').textContent = pick[2];
      }
    </script>
  </body>
</html>
