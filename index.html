<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CodifyQR: free QR code generator, private and offline</title>
    <meta name="description" content="Free QR code generator with Pix, Wi-Fi, vCard, WhatsApp and more. Custom shapes, colors and logo, a read check, PNG, SVG and PDF. Runs in your browser: no sign-up, no tracking." />
    <link rel="canonical" href="https://lucaswotta.github.io/codifyqr/" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f3ea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#102a27" />
    <meta name="referrer" content="no-referrer" />
    <meta name="author" content="Lucas Motta" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CodifyQR" />
    <meta property="og:title" content="CodifyQR: QR codes that never leave your browser" />
    <meta property="og:description" content="Free, open source QR code generator with Pix, Wi-Fi and vCard. Reads its own codes to prove they scan. No sign-up, no tracking." />
    <meta property="og:url" content="https://lucaswotta.github.io/codifyqr/" />
    <meta property="og:image" content="https://lucaswotta.github.io/codifyqr/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CodifyQR: QR codes that never leave your browser" />
    <meta name="twitter:image" content="https://lucaswotta.github.io/codifyqr/social-preview.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "CodifyQR",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "url": "https://lucaswotta.github.io/codifyqr/",
        "description": "Free, open source QR code generator that runs entirely in the browser.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://opensource.org/licenses/MIT",
        "inLanguage": ["en", "pt-BR", "es"]
      }
    </script>
  </head>
  <body>
    <div id="app">
      <main class="boot">
        <h1>CodifyQR</h1>
        <p>QR codes that never leave your browser. Free, open source, no sign-up, no tracking.</p>
        <noscript><p>CodifyQR needs JavaScript to draw QR codes on your device. Nothing is sent anywhere.</p></noscript>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
