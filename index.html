<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CodifyQR: create and check QR codes</title>
    <meta name="description" content="Create QR codes for links, Pix and Wi-Fi. Adjust the design, check that it scans, then export PNG, SVG or PDF." />
    <link rel="canonical" href="https://lucaswotta.github.io/codifyqr/" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F4EF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="referrer" content="no-referrer" />
    <meta name="author" content="Lucas Motta" />
    <link rel="preload" href="/src/assets/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CodifyQR" />
    <meta property="og:title" content="CodifyQR: check it before you print" />
    <meta property="og:description" content="Create QR codes for links, Pix and Wi-Fi. Check that they scan before exporting." />
    <meta property="og:url" content="https://lucaswotta.github.io/codifyqr/" />
    <meta property="og:image" content="https://lucaswotta.github.io/codifyqr/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CodifyQR: check it before you print" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "CodifyQR",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "url": "https://lucaswotta.github.io/codifyqr/",
        "description": "Free, open source QR code generator that runs entirely in the browser.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://opensource.org/licenses/MIT",
        "inLanguage": ["en", "pt-BR", "es"]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <main class="boot">
        <h1>CodifyQR</h1>
        <p>Create a QR code and check that it scans before you print.</p>
        <p>CodifyQR needs JavaScript to draw QR codes on your device. Nothing is sent anywhere.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
